# Builds signed bundles for a version tag (vX.Y.Z) on the three platforms and
# uploads them, with the updater manifest latest.json, to a DRAFT GitHub
# release (ADR 0010). Installed copies only see the update once the draft is
# published. How to cut a release: docs/release.md.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported runner keeps the AppImage's glibc requirement low.
          - os: ubuntu-22.04
            args: --bundles deb,appimage
          # One universal build serves Intel and Apple silicon Macs.
          - os: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-2022
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux prerequisites (WebKitGTK, GTK, librsvg)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --no-audit --no-fund

      - name: Tag matches the app version
        shell: bash
        run: |
          node tools/release/version.mjs
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Updater key and endpoint are configured
        shell: bash
        run: |
          if grep -nE 'REPLACE_WITH_RELEASE_PUBLIC_KEY|github\.com/OWNER/' src-tauri/tauri.conf.json; then
            echo "Set plugins.updater.pubkey and the endpoint owner (docs/release.md)." >&2
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: node tools/release/notes.mjs > "$RUNNER_TEMP/notes.md"

      - name: Generate the performance fixtures
        run: npm run fixtures:large

      - name: Typecheck, lint, test (TypeScript and Rust)
        run: npm run check

      # Regenerates the bundled THIRD-PARTY-NOTICES.md and fails on a license
      # outside the allow-list (ADR 0011, ADR 0012).
      - name: Third-party license notices
        shell: bash
        run: npm run licenses

      - name: Read the release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<GCMD_NOTES_EOF"
            cat "$RUNNER_TEMP/notes.md"
            echo "GCMD_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GCMD ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

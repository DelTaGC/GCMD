[package]
name = "gcmd"
version = "0.3.0"
description = "GCMD - a lightweight single-document GitHub Flavored Markdown editor"
authors = ["Gaetan Cretton"]
license = "GPL-3.0-or-later WITH AdditionRef-GCMD-elkjs-exception"
repository = "https://github.com/DelTaGC/GCMD"
edition = "2024"
# Let chains (`if let .. && let ..`) need 1.88; the MSRV-aware resolver also
# uses this to pick dependency versions, so keep it current.
rust-version = "1.88"

[lib]
# The `_lib` suffix is required so the lib name does not clash with the bin
# name on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "gcmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
notify-debouncer-mini = "0.7.0"
tauri-plugin-updater = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight idiomatic Tauri code.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Tauri commands receive owned arguments (String, State, AppHandle) by design.
needless_pass_by_value = "allow"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }

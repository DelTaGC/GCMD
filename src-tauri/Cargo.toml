[package]
name = "gcmd"
version = "0.1.0"
description = "GCMD - a lightweight single-document GitHub Flavored Markdown editor"
authors = ["Gaetan Cretton"]
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix is required so the lib name does not clash with the bin
# name on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "gcmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight idiomatic Tauri code.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Tauri commands receive owned arguments (String, State, AppHandle) by design.
needless_pass_by_value = "allow"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
